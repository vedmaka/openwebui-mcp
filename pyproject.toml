[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwebui-mcp"
version = "0.1.3"
description = "Open WebUI MCP server (FastMCP) - ask models with tool support, list models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexey @vedmaka" }]
dependencies = [
  # Standalone FastMCP (gofastmcp.com) - builds on MCP SDK v2; keeps the
  # high-level FastMCP API where mcp 2.x removed mcp.server.fastmcp
  "fastmcp==4.0.0b1",
  "openwebui-sdk>=0.1.1",
  "python-dotenv>=1.0",
]

[project.scripts]
openwebui-mcp = "openwebui_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openwebui_mcp = ["py.typed"]

[dependency-groups]
dev = ["pytest>=8.0", "pyright>=1.1.400", "ruff==0.16.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
# fastmcp 4 is a prerelease; allow resolving prereleases
prerelease = "allow"

[tool.uv.exclude-newer-package]
openwebui-sdk = false
ruff = false
fastmcp = false
fastmcp-slim = false
mcp = false
mcp_types = false

# Tell static analyzers (pyright/pylance) this is a src-layout package so the
# intra-package relative imports in __main__.py / cli.py resolve.
[tool.pyright]
include = ["src"]
extraPaths = ["src"]
reportMissingImports = "none"
